<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>放大模式预览 · 方案 A3（3–16 房）</title>
<!--
  放大模式布局预览（与 App 渲染逐字一致）
  · 布局算法：内嵌 src/core/focus-layout.js 的完整副本（生成于 v1.4.5，方案 A3 满屏装配）
  · DOM 结构与样式：逐字复刻 src/app/layout.js 的 focused 分支与 src/ui/styles.css 相关规则
  · 视口：画墙铺满当前窗口，分辨率实时跟随（ResizeObserver + rAF，与 App 的 scheduleLayout 一致）
  · 引擎更新后需重新生成本页（重跑生成拼接即可）
-->
<style>
:root {
  --bg: #0a0c11; --wall: #07080c;
  --panel: rgba(15, 18, 26, .96);
  --card: rgba(255, 255, 255, .045); --card-hover: rgba(255, 255, 255, .09);
  --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .15);
  --text: #eceef4; --dim: #a3adc2; --faint: #626c80;
  --accent: #fb7299; --accent2: #ff9d6b;
  --green: #34d399; --amber: #fbbf24; --red: #f87171; --gray: #5b6472; --blue: #6ea8ff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px / 1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
button, input, select { font-family: inherit; }
h1 { margin: 0; font-size: 15px; font-weight: 700; }
h1 small { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }

/* ===== 控制条 ===== */
.bar { flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-left: auto; }
.ctrl label { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; white-space: nowrap; }
.ctrl b { color: var(--text); font-size: 12px; min-width: 20px; text-align: right; }
.ctrl input[type=range] { width: 140px; accent-color: var(--accent); }
.ctrl select, .ctrl input[type=number] { background: var(--card); border: 1px solid var(--line2); border-radius: 8px; color: var(--text); font-size: 12px; padding: 3px 8px; }
.ctrl input[type=number] { width: 68px; }
.ctrl input[type=checkbox] { accent-color: var(--accent); }

/* ===== 舞台：画墙铺满当前窗口，分辨率实时跟随（与 App 的 ResizeObserver 行为一致） ===== */
.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; background: var(--wall); }
#wall { position: absolute; inset: 0; }

/* ===== 画墙：以下规则逐字取自 src/ui/styles.css ===== */
.wall { min-width: 0; min-height: 0; display: grid; gap: 0.5px; padding: 0; background: linear-gradient(135deg, rgba(56, 138, 240, .26), rgba(56, 138, 240, .11) 48%, rgba(96, 180, 255, .22)); overflow: auto; }
.wall.is-focused { position: relative; overflow: hidden; padding: 0; background: #000; place-content: center; justify-content: center; align-content: center; }
.focus-region { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #000; }
.focus-content { position: relative; min-width: 100%; }
.focus-size-hint { position: absolute; top: 30px; right: 8px; z-index: 14; max-width: calc(100% - 16px); padding: 3px 8px; border-radius: 8px; background: rgba(0, 0, 0, .8); color: var(--amber); font-size: 11px; pointer-events: none; }
.tile-shell { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #000; user-select: none; outline: 0 solid transparent; transition: outline-color .15s ease, box-shadow .15s ease; display: grid; grid-template-columns: minmax(0, 1fr); }
.tile-viewport { position: relative; grid-column: 1; grid-row: 1; width: 100%; height: 100%; min-width: 0; min-height: 0; overflow: hidden; }
/* 视频保持直播流比例完整显示（contain）并居中，允许黑边，不拉伸；只定外层盒子宽高。 */
.tile-video { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; background: #000; }
.tile-status { position: absolute; left: 10px; top: 10px; z-index: 12; display: inline-flex; align-items: center; gap: 6px; width: auto; height: 24px; padding: 0 9px 0 7px; border: 1px solid rgba(255, 255, 255, 0.16) !important; border-radius: 999px; background: rgba(14, 20, 32, 0.6) !important; backdrop-filter: blur(20px) saturate(180%) !important; -webkit-backdrop-filter: blur(20px) saturate(180%) !important; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4), inset 0 1px 0 0 rgba(255, 255, 255, 0.22); }
.t-name { min-width: 0; max-width: 140px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 6px; height: 6px; border-radius: 99px; flex-shrink: 0; background: var(--gray); }
.dot.g { background: var(--green); box-shadow: 0 0 8px rgba(52, 211, 153, .7); }
.dot.gr { background: var(--gray); }

/* ===== 预览专用：模拟直播画面（16:9 源经 object-fit: contain 后的实际画面盒） ===== */
.fake-stream { position: absolute; left: 0; right: 0; top: 0; bottom: 0; margin: auto; overflow: hidden; border-radius: 0; display: grid; place-items: center; }
.fake-stream::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); pointer-events: none; }
.fake-num { font-weight: 800; color: rgba(255, 255, 255, .82); letter-spacing: .04em; text-shadow: 0 2px 18px rgba(0,0,0,.55); }
.fake-cap { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); color: rgba(255,255,255,.66); font-size: 11px; white-space: nowrap; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
.fake-main-badge { position: absolute; right: 8px; top: 8px; z-index: 12; padding: 2px 8px; border-radius: 999px; border: 1px solid rgba(251, 113, 153, .55); color: var(--accent); background: rgba(14, 20, 32, .6); backdrop-filter: blur(20px); font-size: 10px; font-weight: 700; letter-spacing: .08em; }

/* ===== 预览专用：几何辅助线（默认关闭） ===== */
.guide { position: absolute; pointer-events: none; z-index: 30; }
.guide-main { outline: 2px dashed var(--accent); outline-offset: 0; }
.guide-right { outline: 2px dashed var(--amber); }
.guide-bottom { outline: 2px dashed var(--blue); }
.guide-container { outline: 2px dashed rgba(255, 255, 255, .45); }
.guide-cell { outline: 1px solid rgba(52, 211, 153, .55); }
.guide-tag { position: absolute; z-index: 31; pointer-events: none; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.75); }
.guide-tag.main { color: var(--accent); } .guide-tag.right { color: var(--amber); } .guide-tag.bottom { color: var(--blue); } .guide-tag.cell { color: var(--green); }

/* ===== 信息栏 ===== */
.info { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 8px 14px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
.info b { color: var(--text); font-weight: 600; }
.info .sig { color: var(--accent); font-family: Consolas, monospace; }
.info .warn { color: var(--amber); }
</style>
</head>
<body>
  <header class="bar">
    <h1>放大模式预览<small>方案 A3 · 带状装配 + 连续主窗 · 与 App 渲染逐字一致</small></h1>
    <div class="ctrl">
      <label>房间数 <input id="count" type="range" min="3" max="16" step="1" value="8"><b id="countVal">8</b></label>
      <label>主房间 <select id="mainSel" aria-label="主房间"></select></label>
      <label><input id="guides" type="checkbox"> 辅助线</label>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="wall is-focused" id="wall"></div>
  </main>

  <footer class="info" id="info"></footer>

<script type="module">
// 方案 A3 放大模式布局引擎：满屏装配 + 格内黑边。
// 1. 墙恒等于视口（容器 = width×height，四面触达），黑边只允许出现在画面内部：
//    窗格盒子随网格拉伸（可非 16:9），16:9 视频在盒内等比 contain 居中，永不裁切不拉伸；
//    盒子恰为 16:9 时格内零黑边（常见 16:9 视口依旧全屏零黑边）；
// 2. 两族候选：R（右带通高 + 主窗下底带，带随主窗宽）、E（底带通宽 + 右带占上部）；
//    同带内小窗严格等大，右带与底带之间允许不同尺寸；带内末列/末行未摆满的空槽保持黑色（允许的黑边）；
// 3. 锁定变体：每个拓扑枚举三种锁定——cells（小格全 16:9，主窗拉伸）、main（主窗 16:9，小格拉伸）、
//    floor（小格压到可读性下限，主窗极大）——由打分择优；
// 4. 打分：视频可见面积/视口面积（= 格内黑边最小化）；主窗可见面积 ≥ 1.5× 小窗可见面积（主导硬约束）；
// 5. 多轮降级（小格下限逐轮放宽）保证所有房间同屏；临界防抖：打分差距小于 2% 时保留原拓扑。

export const FOCUS_LIMITS = Object.freeze({ mainMin: 640, mainMinHeight: 360, smallMin: 120 });

const DEFAULT_RATIO = 16 / 9;
const HYSTERESIS = 0.02; // 防抖：新拓扑打分领先不足该值时保留原拓扑

const ratioOf = (value) => (Number.isFinite(value) && value > 0 ? value : DEFAULT_RATIO);
const fitVideo = (width, height, ratio) => {
  const r = ratioOf(ratio);
  const fittedWidth = Math.min(width, height * r);
  return { width: fittedWidth, height: fittedWidth / r };
};
const visibleOf = (cw, ch, ratio) => {
  const r = ratioOf(ratio);
  const cellRatio = cw / ch;
  const val = Math.min(cellRatio / r, r / cellRatio);
  return Math.abs(val - 1) < 1e-9 ? 1 : Math.max(0, Math.min(1, val));
};
// 16:9 源在 w×h 盒内 contain 后的可见画面面积。
const visibleArea = (w, h) => Math.min(w * w, h * h * DEFAULT_RATIO * DEFAULT_RATIO) / DEFAULT_RATIO;
const qualityOf = (width, height) => Math.min(1, width / FOCUS_LIMITS.mainMin, height / FOCUS_LIMITS.mainMinHeight);
const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));

// 单个候选：给定族/带参数与锁定方式，按满屏装配产出几何与打分。
// family R：右带通高（小窗 k1 = sr×st），底带在主窗下方（宽随主窗）；family E：底带通宽，右带占上部。
// lock：cells=小格全 16:9；main=主窗 16:9（联立底带 16:9 求主窗宽）；floor=小格宽度压到 cellMin。
const buildShape = ({ family, sr, st, bcm, bandRows, lock, width, height, count, gapX, gapY, cellMin }) => {
  const k1 = Math.min(count, sr * st);
  const k2 = count - k1;
  if (sr > 0 && k1 < 1) return null;
  if (family === "E" && k2 < 1) return null; // E 族必须有底带，否则与 R 族重复
  if (family === "R" && (sr < 1 || k1 < 1)) return null;
  if (k2 > 0 && (bcm < 1 || bandRows < 1)) return null;
  if (k2 === 0 && (bcm > 0 || bandRows > 0)) return null;

  let rightW = 0;
  let bandH = 0;
  let mainW = 0;
  let mainH = 0;
  let cellW = 0;
  let cellH = 0;
  let bandCellW = 0;
  let bandCellH = 0;

  if (family === "R") {
    if (lock === "cells") {
      // 小格全 16:9：右带按高度锁，底带小格宽度锁到主窗宽，主窗拉伸
      cellH = (height - (st - 1) * gapY) / st;
      cellW = cellH * DEFAULT_RATIO;
      rightW = sr * cellW + (sr - 1) * gapX;
      mainW = width - gapX - rightW;
      if (k2 > 0) {
        bandCellW = (mainW - (bcm - 1) * gapX) / bcm;
        bandCellH = bandCellW / DEFAULT_RATIO;
        bandH = bandRows * bandCellH + (bandRows - 1) * gapY;
      }
      mainH = height - (bandH > 0 ? bandH + gapY : 0);
    } else if (lock === "main") {
      // 主窗 16:9，底带小格 16:9 宽度锁（联立求解主窗宽），右带小格拉伸
      if (k2 > 0) {
        mainH = ((height - bandRows * gapY + (bandRows * (bcm - 1) * gapX) / (bcm * DEFAULT_RATIO)) * bcm) / (bcm + bandRows);
        mainW = mainH * DEFAULT_RATIO;
        bandH = height - mainH - gapY;
        bandCellW = (mainW - (bcm - 1) * gapX) / bcm;
        bandCellH = bandCellW / DEFAULT_RATIO;
      } else {
        mainH = height;
        mainW = mainH * DEFAULT_RATIO;
      }
      rightW = width - gapX - mainW;
      if (k1 > 0) {
        cellW = (rightW - (sr - 1) * gapX) / sr;
        cellH = (height - (st - 1) * gapY) / st;
      }
    } else {
      // 小格压到下限宽度，主窗极大
      rightW = sr * cellMin + (sr - 1) * gapX;
      mainW = width - gapX - rightW;
      cellW = cellMin;
      cellH = (height - (st - 1) * gapY) / st;
      if (k2 > 0) {
        bandCellW = (mainW - (bcm - 1) * gapX) / bcm;
        bandCellH = bandCellW / DEFAULT_RATIO;
        bandH = bandRows * bandCellH + (bandRows - 1) * gapY;
      }
      mainH = height - (bandH > 0 ? bandH + gapY : 0);
    }
  } else {
    if (lock === "cells") {
      // 小格全 16:9：底带按视口宽锁，右带按上部高度锁，主窗拉伸
      if (k2 > 0) {
        bandCellW = (width - (bcm - 1) * gapX) / bcm;
        bandCellH = bandCellW / DEFAULT_RATIO;
        bandH = bandRows * bandCellH + (bandRows - 1) * gapY;
      }
      const topH = height - (bandH > 0 ? bandH + gapY : 0);
      if (sr > 0 && k1 > 0) {
        cellH = (topH - (st - 1) * gapY) / st;
        cellW = cellH * DEFAULT_RATIO;
        rightW = sr * cellW + (sr - 1) * gapX;
      }
      mainW = width - (rightW > 0 ? gapX + rightW : 0);
      mainH = topH;
    } else if (lock === "main") {
      if (sr > 0 && k1 > 0) {
        // 主窗 16:9（高度取上部），底带 16:9 宽度锁，右带小格拉伸
        if (k2 > 0) {
          bandCellW = (width - (bcm - 1) * gapX) / bcm;
          bandCellH = bandCellW / DEFAULT_RATIO;
          bandH = bandRows * bandCellH + (bandRows - 1) * gapY;
        }
        const topH = height - (bandH > 0 ? bandH + gapY : 0);
        mainW = topH * DEFAULT_RATIO;
        mainH = topH;
        rightW = width - gapX - mainW;
        cellW = (rightW - (sr - 1) * gapX) / sr;
        cellH = (topH - (st - 1) * gapY) / st;
      } else {
        // 主窗通宽 16:9，底带拉伸吃掉剩余高度
        mainW = width;
        mainH = mainW / DEFAULT_RATIO;
        bandH = height - mainH - gapY;
        if (k2 > 0) {
          bandCellW = (width - (bcm - 1) * gapX) / bcm;
          bandCellH = (bandH - (bandRows - 1) * gapY) / bandRows;
        }
      }
    } else {
      // 底带小格压到下限（不超过均分宽度，避免溢出视口），主窗极大
      if (k2 > 0) {
        bandCellW = Math.min(cellMin, (width - (bcm - 1) * gapX) / bcm);
        bandCellH = bandCellW / DEFAULT_RATIO;
        bandH = bandRows * bandCellH + (bandRows - 1) * gapY;
      }
      const topH = height - (bandH > 0 ? bandH + gapY : 0);
      if (sr > 0 && k1 > 0) {
        cellH = (topH - (st - 1) * gapY) / st;
        cellW = cellH * DEFAULT_RATIO;
        rightW = sr * cellW + (sr - 1) * gapX;
      }
      mainW = width - (rightW > 0 ? gapX + rightW : 0);
      mainH = topH;
    }
  }

  const topHeight = mainH;
  const bottomHeight = bandH > 0 ? bandH : 0;
  if (!(mainW > 0) || !(mainH > 0) || mainW < cellMin - 1e-9) return null;
  if (rightW < -1e-9 || bandH < -1e-9) return null;
  // 小格可读性下限只约束宽度；高度由网格分摊，过矮的盒子会被可见面积打分自然淘汰。
  if (k1 > 0 && (!(cellW > 0) || !(cellH > 0) || cellW < cellMin - 1e-9)) return null;
  if (k2 > 0 && (!(bandCellW > 0) || !(bandCellH > 0) || bandCellW < cellMin - 1e-9)) return null;
  // 满屏硬约束：主窗 + 右带 + 底带必须精确拼满视口
  if (Math.abs(mainW + (rightW > 0 ? gapX + rightW : 0) - width) > 1e-6) return null;
  if (Math.abs(mainH + (bottomHeight > 0 ? bottomHeight + gapY : 0) - height) > 1e-6) return null;
  // 主窗下底带（R 族）不能超出主窗宽
  if (family === "R" && k2 > 0 && bcm * bandCellW + (bcm - 1) * gapX > mainW + 1e-6) return null;

  const mainVisible = visibleArea(mainW, mainH);
  const cellVisible = k1 > 0 ? visibleArea(cellW, cellH) : 0;
  const bandCellVisible = k2 > 0 ? visibleArea(bandCellW, bandCellH) : 0;
  // 主导硬约束：主窗的盒面积与可见画面都不得小于任何小窗
  if (k1 > 0 && (mainW * mainH < cellW * cellH - 1e-9 || mainVisible < cellVisible - 1e-9)) return null;
  if (k2 > 0 && (mainW * mainH < bandCellW * bandCellH - 1e-9 || mainVisible < bandCellVisible - 1e-9)) return null;
  // 格子拉伸上限：16:9 画面至少占盒子的一半（盒比例介于 8:9 与 32:9 之间），防止小窗被挤成看不见的细条
  if (k1 > 0 && visibleOf(cellW, cellH) < 0.5 - 1e-9) return null;
  if (k2 > 0 && visibleOf(bandCellW, bandCellH) < 0.5 - 1e-9) return null;

  const visible = mainVisible + k1 * cellVisible + k2 * bandCellVisible;
  return {
    family,
    sr,
    st,
    bcm,
    bandRows,
    lock,
    rightW,
    bandH,
    mainW,
    mainH,
    cellW,
    cellH,
    bandCellW,
    bandCellH,
    k1,
    k2,
    mainVisible,
    visible,
    score: visible / (width * height),
    mainShare: mainVisible / (width * height),
    signature: `A3:${family}:${st}:${sr}:${bcm}:${bandRows}:${lock}:${count}`
  };
};

const betterShape = (a, b) => {
  if (a.score > b.score + 1e-12) return true;
  if (b.score > a.score + 1e-12) return false;
  return a.mainShare > b.mainShare;
};

export const calculateFocusLayout = ({ width, height, mainRatio = DEFAULT_RATIO, secondaryRatios = [], previous = null }) => {
  if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 2 || height <= 2) return null;

  const count = secondaryRatios.length;
  const totalRooms = count + 1;
  const gap = Math.min(0.5, width / (totalRooms + 2), height / (totalRooms + 2));

  if (!count) {
    // 满屏：主窗盒子铺满视口，16:9 视频在盒内 contain 居中（非 16:9 屏幕出现格内黑边）
    const quality = qualityOf(width, height);
    const mainVideo = fitVideo(width, height, mainRatio);
    return {
      family: "single",
      main: { width, height },
      mainVideo,
      rightWidth: 0,
      topHeight: height,
      bottomHeight: 0,
      rightContentHeight: 0,
      bottomContentHeight: 0,
      bottomSpansWall: false,
      placements: [],
      signature: "single",
      gap,
      gapX: gap,
      gapY: gap * (9 / 16),
      cell: null,
      cellRatio: DEFAULT_RATIO,
      rightCount: 0,
      bottomCount: 0,
      mainArea: width * height,
      meanVisible: 1,
      mainVisible: mainVideo.width * mainVideo.height / (width * height),
      fillRatio: 1,
      layoutFillRatio: 1,
      viewportFillRatio: mainVideo.width * mainVideo.height / (width * height),
      dominant: true,
      bothRegions: false,
      quality,
      constrained: quality < 1 - 1e-7,
      overflow: false,
      containerW: width,
      containerH: height,
      offsetX: 0,
      offsetY: 0,
      voidThickness: 0,
      mainOffsetY: 0
    };
  }

  const gapX = gap;
  const gapY = gap * (9 / 16);

  // 小格宽度下限：常规视口保证可读性；满屏装配下所有房间同屏由构造保证，无需多轮降级。
  const cellFloor = clamp(Math.min(FOCUS_LIMITS.smallMin, width / 8, (height * DEFAULT_RATIO) / 8), 24, FOCUS_LIMITS.smallMin);
  const bySignature = new Map();
  const add = (shape) => {
    if (shape && !bySignature.has(shape.signature)) bySignature.set(shape.signature, shape);
  };
  const context = { width, height, count, gapX, gapY, cellMin: cellFloor };
  const srMax = Math.min(6, count);
  const bcmMax = Math.min(12, count);
  const locks = ["cells", "main", "floor"];

  // R 族：右带 sr×st 通高，剩余小窗进主窗下底带（宽随主窗）
  for (let sr = 1; sr <= srMax; sr++) {
    const stMax = Math.ceil(count / sr);
    for (let st = 1; st <= stMax; st++) {
      const k2 = count - Math.min(count, sr * st);
      if (k2 === 0) {
        for (const lock of locks) add(buildShape({ ...context, family: "R", sr, st, bcm: 0, bandRows: 0, lock }));
      } else {
        for (let bcm = 1; bcm <= Math.min(bcmMax, k2); bcm++) {
          const bandRows = Math.ceil(k2 / bcm);
          for (const lock of locks) add(buildShape({ ...context, family: "R", sr, st, bcm, bandRows, lock }));
        }
      }
    }
  }
  // E 族：底带 bcm×bandRows 通宽，右带占上部（sr=0 即无右带）
  for (let sr = 0; sr <= Math.min(4, count); sr++) {
    if (sr === 0) {
      for (let bcm = 1; bcm <= bcmMax; bcm++) {
        const bandRows = Math.ceil(count / bcm);
        for (const lock of locks) add(buildShape({ ...context, family: "E", sr: 0, st: 0, bcm, bandRows, lock }));
      }
      continue;
    }
    const stMax = Math.ceil(count / sr);
    for (let st = 1; st <= stMax; st++) {
      const k2 = count - Math.min(count, sr * st);
      if (k2 < 1) continue; // 无底带时与 R 族重复
      for (let bcm = 1; bcm <= Math.min(bcmMax, k2); bcm++) {
        const bandRows = Math.ceil(k2 / bcm);
        for (const lock of locks) add(buildShape({ ...context, family: "E", sr, st, bcm, bandRows, lock }));
      }
    }
  }

  let best = null;
  for (const shape of bySignature.values()) if (!best || betterShape(shape, best)) best = shape;
  const previousShape = previous ? bySignature.get(previous) || null : null;
  if (!best) return null;
  // 临界尺寸保留原拓扑，避免 resize 抖动；明显更优时立即切换。
  if (previousShape && previousShape.score >= best.score - HYSTERESIS && previousShape.score >= best.score * 0.98) best = previousShape;

  const { sr, st, bcm, bandRows, lock, rightW, bandH, mainW, mainH, cellW, cellH, bandCellW, bandCellH, k1, k2 } = best;
  const topHeight = mainH;
  const bottomHeight = bandH > 0 ? bandH : 0;
  const bottomSpansWall = best.family === "E";
  const bandWidth = bottomSpansWall ? width : mainW;

  // 右带列优先、底带行优先填充，坐标相对所在 region.content 容器；小窗盒子随网格拉伸。
  const placements = [];
  for (let i = 0; i < k1; i++) {
    const ratio = ratioOf(secondaryRatios[i]);
    placements.push({
      index: i,
      region: "right",
      x: Math.floor(i / st) * (cellW + gapX),
      y: (i % st) * (cellH + gapY),
      width: cellW,
      height: cellH,
      video: fitVideo(cellW, cellH, ratio),
      visible: visibleOf(cellW, cellH, ratio),
      ratio
    });
  }
  for (let j = 0; j < k2; j++) {
    const ratio = ratioOf(secondaryRatios[k1 + j]);
    placements.push({
      index: k1 + j,
      region: "bottom",
      x: (j % bcm) * (bandCellW + gapX),
      y: Math.floor(j / bcm) * (bandCellH + gapY),
      width: bandCellW,
      height: bandCellH,
      video: fitVideo(bandCellW, bandCellH, ratio),
      visible: visibleOf(bandCellW, bandCellH, ratio),
      ratio
    });
  }

  const mainArea = mainW * mainH;
  const cell = k1 > 0 ? { width: cellW, height: cellH } : { width: bandCellW, height: bandCellH };
  const cellRatio = cell.width / cell.height;
  const mainVideo = fitVideo(mainW, mainH, mainRatio);
  const quality = qualityOf(mainW, mainH);
  const meanVisible = placements.reduce((sum, p) => sum + p.visible, 0) / (placements.length || 1);
  const mainVisibleFrac = mainVideo.width * mainVideo.height / mainArea;
  const rightCount = k1;
  const bottomCount = k2;

  return {
    family: "A3",
    main: { width: mainW, height: mainH },
    mainVideo,
    rightWidth: rightW,
    topHeight,
    bottomHeight,
    rightContentHeight: rightCount > 0 ? (best.family === "R" ? height : topHeight) : 0,
    bottomContentHeight: bottomHeight,
    bottomSpansWall,
    placements,
    signature: best.signature,
    gap,
    gapX,
    gapY,
    cell,
    cellRatio,
    rightCount,
    bottomCount,
    mainArea,
    meanVisible,
    mainVisible: mainVisibleFrac,
    fillRatio: 1,
    layoutFillRatio: 1,
    viewportFillRatio: best.visible / (width * height),
    dominant: mainArea >= 1.5 * Math.max(cell.width * cell.height, k2 > 0 ? bandCellW * bandCellH : 0),
    bothRegions: rightCount > 0 && bottomCount > 0,
    quality,
    constrained: quality < 0.98,
    overflow: false,
    containerW: width,
    containerH: height,
    offsetX: 0,
    offsetY: 0,
    voidThickness: 0,
    mainOffsetY: 0
  };
};

// ===================== 预览控制 =====================
const R = 16 / 9;
const wall = document.getElementById("wall");
const stage = document.getElementById("stage");
const info = document.getElementById("info");
const countInput = document.getElementById("count");
const countVal = document.getElementById("countVal");
const mainSel = document.getElementById("mainSel");
const guidesBox = document.getElementById("guides");

let viewport = { w: 0, h: 0 };
let count = 8;
let mainIndex = 0; // 主房间在全部房间中的序号（0 基）
let lastSignature = null;

// 视口 = 画墙当前实际尺寸（铺满窗口），与 App 读取 wall.getBoundingClientRect 一致。
const measure = () => { viewport = { w: stage.clientWidth, h: stage.clientHeight }; };

const fit16x9 = (cw, ch) => {
  const w = Math.min(cw, ch * R);
  return { w, h: w / R };
};

// 模拟一路 16:9 直播源经 object-fit: contain 后的实际画面盒（与 App 行为一致）。
const fakeStream = (index, isMain, streamWidth) => {
  const hue = (index * 47 + 210) % 360;
  const grad = `linear-gradient(135deg, hsl(${hue} 52% 34%), hsl(${(hue + 40) % 360} 58% 22%))`;
  const numSize = Math.round(Math.max(14, Math.min(96, streamWidth * 0.28)));
  return `<div class="fake-stream" style="background:${grad}">
    <span class="fake-num" style="font-size:${numSize}px">${isMain ? "主" : index + 1}</span>
    <span class="fake-cap">直播间 ${index + 1} · 直播画面占位</span>
  </div>`;
};

const tileShell = (index, isMain, box, extraStyle = "") => {
  const fit = fit16x9(box.width, box.height);
  return `<article class="tile-shell${isMain ? " is-focused" : ""}" style="${extraStyle}width:${box.width}px;height:${box.height}px;">
    <div class="tile-viewport">
      <div class="tile-video"><div style="position:absolute;inset:0;margin:auto;width:${fit.w}px;height:${fit.h}px;">${fakeStream(index, isMain, fit.w)}</div></div>
      <header class="tile-status"><i class="dot g"></i><b class="t-name">直播间 ${index + 1}</b></header>
      ${isMain ? '<span class="fake-main-badge">主屏</span>' : ""}
    </div>
  </article>`;
};

const render = () => {
  countVal.textContent = String(count);
  mainSel.replaceChildren(...Array.from({ length: count }, (_, i) => {
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = `房间 ${i + 1}`;
    return opt;
  }));
  mainSel.value = String(Math.min(mainIndex, count - 1));

  const secondaryRatios = [];
  for (let i = 0; i < count; i++) if (i !== mainIndex) secondaryRatios.push(R);
  const plan = calculateFocusLayout({ width: viewport.w, height: viewport.h, mainRatio: R, secondaryRatios, previous: lastSignature });
  wall.replaceChildren();
  if (!plan) {
    info.innerHTML = '<span class="warn">窗口过小，无法计算布局</span>';
    return;
  }
  lastSignature = plan.signature;

  // —— 以下与 src/app/layout.js 的 focused 分支逐字对应 ——
  wall.style.columnGap = `${plan.gapX ?? plan.gap}px`;
  wall.style.rowGap = `${plan.gapY ?? plan.gap}px`;
  wall.style.gridTemplateColumns = plan.rightWidth ? `${plan.main.width}px ${plan.rightWidth}px` : `${plan.main.width}px`;
  wall.style.gridTemplateRows = plan.bottomHeight ? `${plan.topHeight}px ${plan.bottomHeight}px` : `${plan.topHeight}px`;

  wall.insertAdjacentHTML("beforeend", tileShell(mainIndex, true, plan.main, `grid-column:1;grid-row:1;justify-self:start;align-self:${plan.mainOffsetY > 0.01 ? "center" : "start"};`));

  if (plan.rightWidth) {
    wall.insertAdjacentHTML("beforeend",
      `<section class="focus-region" data-focus-region="right" aria-label="右侧小直播间" style="grid-column:2;grid-row:${plan.bottomSpansWall ? "1" : "1 / -1"};">
        <div class="focus-content" style="height:${plan.rightContentHeight}px;"></div>
      </section>`);
  }
  if (plan.bottomHeight) {
    wall.insertAdjacentHTML("beforeend",
      `<section class="focus-region" data-focus-region="bottom" aria-label="底部小直播间" style="grid-column:${plan.bottomSpansWall ? "1 / -1" : "1"};grid-row:2;">
        <div class="focus-content" style="height:${plan.bottomContentHeight}px;"></div>
      </section>`);
  }
  for (const placement of plan.placements) {
    const region = wall.querySelector(`[data-focus-region="${placement.region}"] .focus-content`);
    region.insertAdjacentHTML("beforeend", tileShell(placement.index + (placement.index >= mainIndex ? 1 : 0), false, placement,
      `position:absolute;left:${placement.x}px;top:${placement.y}px;`));
  }
  const showHint = plan.constrained && plan.quality < 0.98;
  if (showHint) wall.insertAdjacentHTML("beforeend", '<span class="focus-size-hint" role="status">窗口较小：画面已统一缩放，所有房间保持同屏</span>');

  if (guidesBox.checked) drawGuides(plan);

  // —— 信息栏 ——
  const pct = (v) => `${(v * 100).toFixed(2)}%`;
  info.innerHTML = `
    <span>当前分辨率 <b>${viewport.w}×${viewport.h}</b></span>
    <span>签名 <b class="sig">${plan.signature}</b></span>
    <span>总覆盖 <b>${pct(plan.viewportFillRatio)}</b></span>
    <span>容器贴满 <b>${pct(plan.layoutFillRatio)}</b></span>
    <span>容器 <b>${Math.round(plan.containerW)}×${Math.round(plan.containerH)}</b></span>
    <span>主窗 <b>${Math.round(plan.main.width)}×${Math.round(plan.main.height)}</b></span>
    <span>格子 <b>${Math.round(plan.cell.width)}×${Math.round(plan.cell.height)}</b></span>
    <span>右带/底带 <b>${plan.rightCount}/${plan.bottomCount}</b></span>
    <span>缝隙 <b>${plan.gapX}px / ${plan.gapY}px</b></span>
    ${plan.meanVisible < 0.999 ? `<span>格内黑边 <b class="warn">${Math.round((1 - plan.meanVisible) * 100)}%</b></span>` : '<span>格内黑边 <b>无</b></span>'}
    ${showHint ? '<span class="warn">统一缩放（主窗低于 640×360）</span>' : ""}`;
};

// 几何辅助线：主窗/右带/底带/容器外框与每格序号（仅预览叠加层，不影响布局）。
const drawGuides = (plan) => {
  const tag = (cls, text, x, y) => `<span class="guide-tag ${cls}" style="left:${x}px;top:${y}px;">${text}</span>`;
  let html = `<span class="guide guide-container" style="left:${plan.offsetX}px;top:${plan.offsetY}px;width:${plan.containerW}px;height:${plan.containerH}px;"></span>`;
  const mainY = plan.offsetY + (plan.mainOffsetY || 0);
  html += `<span class="guide guide-main" style="left:${plan.offsetX}px;top:${mainY}px;width:${plan.main.width}px;height:${plan.main.height}px;"></span>`;
  html += tag("main", `主窗 ${Math.round(plan.main.width)}×${Math.round(plan.main.height)}`, plan.offsetX + 6, mainY + 30);
  if (plan.rightWidth) {
    const rx = plan.offsetX + plan.main.width + plan.gapX;
    html += `<span class="guide guide-right" style="left:${rx}px;top:${plan.offsetY}px;width:${plan.rightWidth}px;height:${plan.bottomSpansWall ? plan.topHeight : plan.containerH}px;"></span>`;
    html += tag("right", `右带 ×${plan.rightCount}`, rx + 6, plan.offsetY + 6);
  }
  if (plan.bottomHeight) {
    const by = plan.offsetY + plan.topHeight + plan.gapY;
    const bw = plan.bottomSpansWall ? plan.containerW : plan.main.width;
    html += `<span class="guide guide-bottom" style="left:${plan.offsetX}px;top:${by}px;width:${bw}px;height:${plan.bottomHeight}px;"></span>`;
    html += tag("bottom", `底带 ×${plan.bottomCount}`, plan.offsetX + 6, by + 6);
  }
  for (const room of plan.placements) {
    const x = (room.region === "right" ? plan.offsetX + plan.main.width + plan.gapX : plan.offsetX) + room.x;
    const y = (room.region === "bottom" ? plan.offsetY + plan.topHeight + plan.gapY : plan.offsetY) + room.y;
    html += `<span class="guide guide-cell" style="left:${x}px;top:${y}px;width:${room.width}px;height:${room.height}px;"></span>`;
    html += tag("cell", String(room.index + (room.index >= mainIndex ? 1 : 0) + 1), x + 3, y + 3);
  }
  wall.insertAdjacentHTML("beforeend", html);
};

// 与 App 的 scheduleLayout 相同：ResizeObserver 触发 + rAF 合帧，窗口分辨率变化实时重排。
let frame = null;
const scheduleRender = () => {
  if (frame !== null) return;
  frame = requestAnimationFrame(() => { frame = null; measure(); render(); });
};

countInput.addEventListener("input", () => {
  count = Number(countInput.value);
  if (mainIndex > count - 1) mainIndex = count - 1;
  render();
});
mainSel.addEventListener("change", () => { mainIndex = Number(mainSel.value); render(); });
guidesBox.addEventListener("change", render);
new ResizeObserver(scheduleRender).observe(stage);
window.addEventListener("resize", scheduleRender);

measure();
render();
</script>
</body>
</html>
